plugins {
    id 'com.android.application'
}

android {
    namespace 'app.kehribar'
    compileSdk 34

    defaultConfig {
        applicationId 'app.kehribar'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
